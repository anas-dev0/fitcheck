[project]
name = "fitcheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.104",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
fitcheck = "fitcheck:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
